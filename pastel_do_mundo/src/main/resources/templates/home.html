<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cardápio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header class="topbar">

    <div class="brand">
        Pastel do Mundo
    </div>

    <div class="profile-wrapper">
        <div class="profile-container">

            <div class="profile-btn">
                <span class="material-symbols-outlined">person</span>
            </div>

            <div class="profile-dropdown">

                <div th:if="${session.usuario == null}">
                    <a th:href="@{/login}">Entrar</a>
                    <a th:href="@{/cadastro}">Criar conta</a>
                </div>

                <div th:if="${session.usuario != null}">
                    <a th:href="@{/perfil}">Perfil</a>
                    <a th:href="@{/logout}">Sair</a>
                </div>

            </div>

        </div>
    </div>

</header>

<section class="hero">
    <h2>Cardápio</h2>
</section>

<section class="categorias">

    <a class="categoria"
       th:each="c : ${categorias}"
       th:href="'#' + ${c}"
       th:text="${c}">
    </a>

</section>

<main>

    <div th:each="entry : ${produtosPorCategoria}">

        <div th:id="${entry.key}"
             style="color:#fff; background:#f0c14b; padding:10px; margin-top:20px; font-weight:600;">
            <span th:text="${entry.key}"></span>
        </div>

        <div class="produtos">

            <div class="card" th:each="p : ${entry.value}">

                <img th:src="@{'/imagens/' + ${p.URLimagem}}"
                     th:alt="${p.nome}">

                <div class="card-content">

                    <h3 th:text="${p.nome}"></h3>

                    <p th:text="${p.descricao}"></p>

                    <div class="preco"
                         th:text="${'R$ ' + p.preco}">
                    </div>

                    <form th:action="@{/carrinho/adicionar}" method="post">
                        <input type="hidden"
                               name="produtoId"
                               th:value="${p.id}">

                        <button class="btn" type="submit">
                            Adicionar
                        </button>
                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

<aside class="cart-sidebar">

    <div class="cart-header">
        <h3>Seu pedido</h3>
        <span th:text="${qtdCarrinho} + ' itens'">0 itens</span>
    </div>

    <div class="cart-item" th:each="item : ${carrinho}">

        <span th:text="${item.nome}"></span>

        <span th:text="${item.quantidade}"></span>

        <form th:action="@{/carrinho/remover}"
              method="post"
              style="display:inline;">

            <input type="hidden"
                   name="produtoId"
                   th:value="${item.produtoId}">

            <button type="submit"
                    style="background:none; border:none; cursor:pointer;">

                <span class="material-symbols-outlined">delete</span>

            </button>

        </form>

    </div>

    <div class="cart-footer">

        <div class="cart-total">
            Total: R$ <span th:text="${total}">0,00</span>
        </div>

        <a th:href="@{/checkout}" class="checkout-btn">
            Finalizar pedido
        </a>

    </div>

</aside>

<div class="cart-tab">
    Pedido
</div>

</body>

</html>
