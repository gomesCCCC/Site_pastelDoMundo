<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perfil</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <link rel="stylesheet" th:href="@{/css/perfil.css}">
</head>

<body>

<div class="perfil-container">

    <header class="perfil-header">
        <a href="/" class="back">← Voltar</a>
        <h1>Perfil</h1>
    </header>

    <section class="perfil-card">

        <div class="avatar">
            <span class="material-symbols-outlined">person</span>
        </div>

        <div class="info">

            <h2 th:text="${cliente.nome}">
                Usuário
            </h2>

            <p>
                <strong>Email:</strong>
                <span th:text="${cliente.email}">
                    cliente@exemplo.com
                </span>
            </p>

            <p>
                <strong>Telefone:</strong>
                <span th:text="${cliente.telefone}">
                    Não informado
                </span>
            </p>

            <p>
                <strong>Endereço:</strong>
                <span th:text="${cliente.endereco}">
                    Não informado
                </span>
            </p>

            <p>
                <strong>CEP:</strong>
                <span th:text="${cliente.CEP}">
                    Não informado
                </span>
            </p>

        </div>

    </section>

    <section class="perfil-opcoes">

        <a href="#" class="opcao">
            Meus pedidos
        </a>

        <a href="#" class="opcao">
            Endereços
        </a>

        <a href="#" class="opcao">
            Configurações
        </a>

    </section>

</div>

</body>
</html>
