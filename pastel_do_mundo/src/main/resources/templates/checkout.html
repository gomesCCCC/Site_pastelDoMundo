<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Pedido</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <link rel="stylesheet" th:href="@{/css/checkout.css}">
</head>

<body>

<div class="container">

    <header class="checkout-header">
        <p class="subtitle">Finalize seu pedido</p>
    </header>

    <form th:action="@{/pedidos/confirmar}" method="post">

        <div class="grid-checkout">

            <section class="secao-checkout">

                <h2>
                    <span class="material-symbols-outlined icon">map_pin_heart</span>
                    Entrega
                </h2>

                <div th:if="${session.usuario != null}">

                    <div class="campo-grupo">
                        <label>Nome</label>
                        <input type="text"
                               name="nomeCliente"
                               th:value="${session.usuario.nome}"
                               readonly>
                    </div>

                    <div class="campo-grupo">
                        <label>Telefone</label>
                        <input type="tel"
                               name="telefone"
                               th:value="${session.usuario.telefone}"
                               required>
                    </div>

                    <div class="campo-grupo">
                        <label>Endereço</label>
                        <textarea name="endereco"
                                  rows="3"
                                  required
                                  th:text="${session.usuario.endereco}">
                        </textarea>
                    </div>

                    <div class="campo-grupo">
                        <label>CEP</label>
                        <input type="text"
                               name="cep"
                               th:value="${session.usuario.CEP}">
                    </div>

                </div>

                <div th:if="${session.usuario == null}">

                    <div class="campo-grupo">
                        <label>Nome</label>
                        <input type="text" name="nomeCliente" required>
                    </div>

                    <div class="campo-grupo">
                        <label>Telefone</label>
                        <input type="tel" name="telefone" required>
                    </div>

                    <div class="campo-grupo">
                        <label>Endereço</label>
                        <textarea name="endereco" rows="3" required></textarea>
                    </div>

                    <div class="campo-grupo">
                        <label>CEP</label>
                        <input type="text" name="cep">
                    </div>

                </div>

            </section>

            <aside>

                <section class="secao-checkout">

                    <h2>
                        <span class="material-symbols-outlined icon">shopping_cart</span>
                        Resumo
                    </h2>

                    <div class="item-resumo" th:each="item : ${itens}">
                        <span th:text="${item.quantidade + 'x ' + item.nome}"></span>
                        <span th:text="'R$ ' + ${item.subtotal}"></span>
                    </div>

                    <div class="total-box">
                        Total: <span th:text="'R$ ' + ${total}"></span>
                    </div>

                </section>

                <section class="secao-checkout">

                    <h2>
                        <span class="material-symbols-outlined icon">payments</span>
                        Pagamento
                    </h2>

                    <p style="margin-top:10px;">
                        O pagamento será processado automaticamente após a confirmação do pedido.
                    </p>

                </section>

                <button type="submit" class="btn-finalizar">
                    Confirmar pedido
                </button>

            </aside>

        </div>

    </form>

</div>

</body>
</html>
